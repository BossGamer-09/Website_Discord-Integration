{% comment %}
Shared design tokens and component styles for schedevents templates.
All templates that extend base.html include this at the top of {% block content %}.
Fonts + flash-prevention are loaded here so they work in both extending and standalone contexts.
{% endcomment %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>
(function(){
  var t = localStorage.getItem('bv-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ── Design Tokens ── */
:root {
  --ink: #0f1117; --ink-muted: #4a4f5e; --ink-subtle: #9399a8;
  --surface: #f4f5f9; --surface-raised: #ecedf3; --card-bg: #ffffff;
  --border: #e2e4ef; --border-strong: #c8cadb;
  --accent: #2563eb; --accent-light: #eff4ff; --accent-hover: #1d4ed8;
  --success: #16a34a; --success-light: #f0fdf4; --success-border: #bbf7d0;
  --danger: #dc2626;  --danger-light:  #fef2f2; --danger-border:  #fecaca;
  --warning: #d97706; --warning-light: #fffbeb; --warning-border: #fde68a;
  --purple: #7c3aed;  --purple-light:  #f5f3ff; --purple-border:  #ddd6fe;
  --radius: 14px; --radius-sm: 8px; --radius-xs: 5px;
  --shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 20px rgba(0,0,0,.06);
  --shadow-hover: 0 4px 12px rgba(37,99,235,.14), 0 8px 32px rgba(37,99,235,.10);
  --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 6px 28px rgba(0,0,0,.08);
  --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Syne', sans-serif;
  --font-mono: 'Space Mono', monospace;
}
[data-theme="dark"] {
  --ink: #e8eaf0; --ink-muted: #8b91a6; --ink-subtle: #555c73;
  --surface: #0b0d12; --surface-raised: #10121a; --card-bg: #151820;
  --border: #22263a; --border-strong: #363a52;
  --accent: #3b82f6; --accent-light: #162240; --accent-hover: #60a5fa;
  --success: #22c55e; --success-light: #042010; --success-border: #14532d;
  --danger: #f87171;  --danger-light:  #250000; --danger-border:  #7f1d1d;
  --warning: #f59e0b; --warning-light: #1c1200; --warning-border: #6a3800;
  --purple: #a78bfa;  --purple-light:  #1a1040; --purple-border:  #4c1d95;
  --shadow: 0 1px 3px rgba(0,0,0,.35), 0 4px 20px rgba(0,0,0,.45);
  --shadow-hover: 0 4px 12px rgba(59,130,246,.22), 0 8px 32px rgba(59,130,246,.14);
  --shadow-card: 0 1px 3px rgba(0,0,0,.4), 0 6px 28px rgba(0,0,0,.55);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { background: var(--surface); font-family: var(--font-sans); color: var(--ink); margin: 0; transition: background-color .22s, color .18s; }

/* ── Theme toggle ── */
.bv-theme-toggle,.theme-toggle {
  position: fixed; top: 16px; right: 16px; z-index: 1000;
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--card-bg); color: var(--ink-muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-card); transition: all .18s; padding: 0;
}
.bv-theme-toggle:hover,.theme-toggle:hover { border-color: var(--accent); color: var(--ink); transform: scale(1.08); }
.bv-theme-toggle .icon-sun,.theme-toggle .icon-sun   { display: none; }
.bv-theme-toggle .icon-moon,.theme-toggle .icon-moon { display: block; }
[data-theme="dark"] .bv-theme-toggle .icon-sun,[data-theme="dark"] .theme-toggle .icon-sun   { display: block; }
[data-theme="dark"] .bv-theme-toggle .icon-moon,[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

/* ── Layout ── */
.page-shell      { max-width: 900px;  margin: 0 auto; padding: 44px 24px 80px; }
.page-shell-wide { max-width: 1100px; margin: 0 auto; padding: 44px 24px 80px; }
.page-wordmark { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; text-decoration: none; }
.bv-logo-img   { height: 34px; width: 34px; object-fit: contain; border-radius: 8px; flex-shrink: 0; }
.bv-wm-name    { font-family: var(--font-display); font-weight: 800; font-size: 1.02rem; letter-spacing: -.02em; color: var(--ink); }
.bv-wm-sep     { color: var(--ink-subtle); font-size: 1rem; font-weight: 300; }
.bv-wm-page    { font-family: var(--font-display); font-weight: 600; font-size: 1.0rem; color: var(--accent); }
.breadcrumb    { font-size: .82rem; color: var(--ink-muted); margin-bottom: 32px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.breadcrumb a  { color: var(--ink-muted); text-decoration: none; } .breadcrumb a:hover { color: var(--accent); }
.breadcrumb-sep { color: var(--border); }

/* ── Cards ── */
.section-card {
  background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-card);
  border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden;
  animation: bv-fade-up .3s ease both; transition: background-color .22s, border-color .22s, box-shadow .22s;
}
.section-card:nth-child(2){animation-delay:.05s}.section-card:nth-child(3){animation-delay:.10s}
.section-card:nth-child(4){animation-delay:.15s}.section-card:nth-child(5){animation-delay:.20s}
@keyframes bv-fade-up { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
/* legacy alias */
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

.section-header {
  padding: 16px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; transition: border-color .22s;
}
.section-header h2 {
  font-family: var(--font-display); font-weight: 700; font-size: .8rem;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-muted); margin: 0;
}
.section-header h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 1.45rem;
  letter-spacing: -.025em; color: var(--ink); margin: 0;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

/* ── Nav rows ── */
.nav-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 22px; border-bottom: 1px solid var(--border); transition: background-color .14s, border-color .22s; }
.nav-item:last-child { border-bottom: none; }
.nav-item:hover { background: var(--accent-light); }
.nav-item-label { font-weight: 500; font-size: .93rem; color: var(--ink); }
.nav-item-desc  { font-size: .8rem; color: var(--ink-muted); margin-top: 2px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
  border-radius: var(--radius-sm); font-family: var(--font-sans); font-weight: 500;
  font-size: .85rem; cursor: pointer; text-decoration: none; border: none; transition: all .15s; white-space: nowrap;
}
.btn:hover { text-decoration: none; }
.btn-primary  { background: var(--accent); color: #fff; }
.btn-primary:hover  { background: var(--accent-hover); color: #fff; box-shadow: var(--shadow-hover); }
.btn-success  { background: var(--success); color: #fff; }
.btn-success:hover  { filter: brightness(.9); color: #fff; }
.btn-danger   { background: var(--danger);  color: #fff; }
.btn-danger:hover   { filter: brightness(.9); color: #fff; }
.btn-ghost    { background: transparent; color: var(--ink-muted); border: 1px solid var(--border); }
.btn-ghost:hover    { background: var(--accent-light); color: var(--ink); border-color: var(--accent); }
.btn-warning  { background: var(--warning-light); color: var(--warning); border: 1px solid var(--warning-border); }
.btn-sm  { padding: 5px 11px; font-size: .78rem; border-radius: 6px; }
.btn-lg  { padding: 11px 22px; font-size: .95rem; border-radius: 10px; }
.btn-block { width: 100%; justify-content: center; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .68rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; padding: 2px 8px; border-radius: 99px; white-space: nowrap;
}
.badge-active    { background: var(--success-light); color: var(--success); border: 1px solid var(--success-border); }
.badge-published { background: var(--accent-light);  color: var(--accent);  border: 1px solid var(--accent); }
.badge-draft     { background: var(--border);         color: var(--ink-muted); }
.badge-completed { background: var(--purple-light);   color: var(--purple);  border: 1px solid var(--purple-border); }
.badge-cancelled { background: var(--danger-light);   color: var(--danger);  border: 1px solid var(--danger-border); }
.badge-warning   { background: var(--warning-light);  color: var(--warning); border: 1px solid var(--warning-border); }
.staff-badge { background: var(--warning-light); color: var(--warning); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--warning-border); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

/* ── Card footer ── */
.card-actions { padding: 13px 22px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-raised); transition: background-color .22s, border-color .22s; }
.card-actions .ms-auto { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ── Forms ── */
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: .85rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.form-control { width: 100%; padding: 9px 13px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--card-bg); color: var(--ink); font-family: var(--font-sans); font-size: .9rem; transition: border-color .15s, box-shadow .15s; appearance: none; }
.form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
textarea.form-control { resize: vertical; min-height: 100px; }
select.form-control { cursor: pointer; }
.form-hint  { font-size: .77rem; color: var(--ink-subtle); margin-top: 4px; }
.form-error { font-size: .77rem; color: var(--danger); margin-top: 4px; font-weight: 500; }
.form-check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9rem; }
.form-check input { cursor: pointer; accent-color: var(--accent); width: 16px; height: 16px; }
.form-section-title { font-family: var(--font-display); font-weight: 700; font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

/* ── Messages ── */
.messages { list-style: none; padding: 0; margin: 0 0 20px; }
.messages li { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: .875rem; font-weight: 500; }
.messages .success { background: var(--success-light); color: var(--success); border: 1px solid var(--success-border); }
.messages .error   { background: var(--danger-light);  color: var(--danger);  border: 1px solid var(--danger-border); }
.messages .warning { background: var(--warning-light); color: var(--warning); border: 1px solid var(--warning-border); }
.messages .info    { background: var(--accent-light);  color: var(--accent);  border: 1px solid var(--accent); }

/* ── Utility ── */
.ms-auto { margin-left: auto !important; }
.empty-hint { padding: 48px 24px; text-align: center; color: var(--ink-subtle); font-size: .9rem; }
.link-accent { color: var(--accent); text-decoration: none; }
.link-accent:hover { text-decoration: underline; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ── Local-time util ── */
@media(max-width:640px) {
  .page-shell,.page-shell-wide { padding: 24px 16px 60px; }
  .section-header { flex-direction: column; align-items: flex-start; }
}
</style>
<script>
/* Local-time conversion — add data-ts="<unix_seconds>" to any element.
   data-ts-fmt="datetime|date|time" (default: datetime). */
function _bvLocalTime(ts, fmt) {
  var d = new Date(ts * 1000);
  var tz = d.toLocaleTimeString(undefined, {timeZoneName:'short'}).split(' ').pop();
  var date = d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  var time = d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  if (fmt === 'time') return time + ' ' + tz;
  if (fmt === 'date') return date;
  return date + ' at ' + time + ' ' + tz;
}
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('[data-ts]:not([data-lt-done])').forEach(function(el) {
    var ts = parseInt(el.getAttribute('data-ts'), 10);
    if (!isNaN(ts)) el.textContent = _bvLocalTime(ts, el.getAttribute('data-ts-fmt') || 'datetime');
  });
});
</script>
